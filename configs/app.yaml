application:
  name: CCTV Finder Agent
  environment: development
  log_level: DEBUG

server:
  host: 127.0.0.1
  port: 8000
  request_timeout_seconds: 45

api:
  max_message_characters: 2000
  max_requests_per_minute: 30

auth:
  # `development` accepts local development identity headers only.
  # Set to `bearer` outside local development and provide the referenced token
  # through the process environment. This is a bootstrap authenticator, not an
  # identity-provider integration.
  mode: development
  development_user_id: dev-user
  development_household_id: demo-household
  credentials:
    - token_environment_variable: CCTV_DEMO_BEARER_TOKEN
      user_id: demo-user
      household_id: demo-household

guardrails:
  max_message_characters: 2000
  llm_filter:
    enabled: true
    max_output_tokens: 80
    policy: >-
      Flag messages that are clearly seeking escalation or intervention in a
      conflict, asking the assistant to investigate or adjudicate a personal
      dispute using CCTV, or containing targeted harassment, threats, or abusive
      requests about a person. Do not flag neutral, ordinary camera questions,
      simple mentions of a person, or frustration that is not directed at a
      person. If the message does not clearly match a configured topic, allow it.
    topics:
      - name: escalation
        description: >-
          Requests to escalate a complaint or conflict, involve an authority or
          third party, or seek intervention against someone based on CCTV footage.
        examples:
          - Escalate this complaint about my neighbor to the building manager.
          - Contact the police about the person seen in the footage.
      - name: dispute
        description: >-
          Requests to investigate, adjudicate, assign blame, or prove allegations
          in an interpersonal, neighbor, tenant, or household conflict using CCTV.
        examples:
          - Use the footage to prove my neighbor took my package.
          - Tell me who is at fault in this argument.
          - No, you are wrong - the door is locked. 
      - name: harassment
        description: >-
          Targeted abusive, threatening, humiliating, intimidating, or stalking
          content, or requests to use footage to shame or target a person.
        examples:
          - Help me identify and shame the person in the recording.
          - Track that person so I can confront and threaten them.
  blocked_patterns:
    - category: prompt_injection
      pattern: '(?i)\bignore\s+(?:all\s+)?(?:previous|prior|system)\s+instructions?\b'
    - category: prompt_injection
      pattern: '(?i)\b(?:reveal|print|show|repeat)\s+(?:the\s+)?(?:system|developer)\s+(?:prompt|instructions?)\b'
    - category: data_exfiltration
      pattern: '(?i)\b(?:exfiltrate|leak)\s+(?:the\s+)?(?:conversation|system\s+prompt|credentials|secrets)\b'
    - category: tool_abuse
      pattern: '(?i)\b(?:run|execute)\s+(?:shell|arbitrary\s+code|a\s+command)\b'

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3
  thinking_model: false
  # Enable Qwen3 reasoning for the intent classifier's structured response.
  think: false
  chat_path: /api/chat 
  readiness_path: /api/tags
  timeout_seconds: 35
  temperature: 0.0
  max_output_tokens: 512
  keep_alive: 5m

guardrail_llm:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3
  thinking_model: false
  think: false
  chat_path: /api/chat
  readiness_path: /api/tags
  timeout_seconds: 35
  temperature: 0.0
  max_output_tokens: 128
  keep_alive: 5m

crewai:
  agents:
    front_entrance:
      role: Front Entrance Intent Agent
      goal: Acknowledge that the request was routed to the front entrance agent.
      backstory: You handle requests classified for the front entrance camera region.
      instructions: Respond only with the configured acknowledgement. Do not answer the underlying camera question or claim to have inspected footage.
      examples:
        - User asks whether the front door is closed.
        - User asks whether a person is by the front entrance.
      expected_reply: "Hey, you've chosen the front entrance."
    parking:
      role: Parking Intent Agent
      goal: Acknowledge that the request was routed to the parking agent.
      backstory: You handle requests classified for the parking camera region.
      instructions: Respond only with the configured acknowledgement. Do not answer the underlying camera question or claim to have inspected footage.
      examples:
        - User asks whether a car is in the parking lot.
        - User asks how many vehicles are parked.
      expected_reply: "Hey, you've chosen parking."
    back_entrance:
      role: Back Entrance Intent Agent
      goal: Acknowledge that the request was routed to the back entrance agent.
      backstory: You handle requests classified for the back entrance camera region.
      instructions: Respond only with the configured acknowledgement. Do not answer the underlying camera question or claim to have inspected footage.
      examples:
        - User asks whether the back door is open.
        - User asks whether anyone is at the rear entrance.
      expected_reply: "Hey, you've chosen the back entrance."
    common_lawn:
      role: Common Lawn Intent Agent
      goal: Acknowledge that the request was routed to the common lawn agent.
      backstory: You handle requests classified for the common lawn camera region.
      instructions: Respond only with the configured acknowledgement. Do not answer the underlying camera question or claim to have inspected footage.
      examples:
        - User asks whether anyone is on the common lawn.
        - User asks whether an animal is in the garden.
      expected_reply: "Hey, you've chosen the common lawn."
    greetings:
      role: Greetings Agent
      goal: Acknowledge a greeting routed to the greetings agent.
      backstory: You handle brief greetings and conversational openings.
      instructions: Respond only with the configured acknowledgement. Do not start an unrelated conversation.
      examples:
        - User says hello.
        - User says good morning.
      expected_reply: "Hey, you've chosen greetings."
    intent_clarify:
      role: Clarification Agent
      goal: Acknowledge that the request was routed for clarification.
      backstory: You handle requests whose location or scope needs clarification.
      instructions: Respond only with the configured acknowledgement for this initial routing slice. Do not answer the underlying camera question.
      examples:
        - User asks whether my door is open without naming a location.
        - User asks about multiple camera regions in one request.
      expected_reply: "Hey, you've chosen intent clarification."
    out_of_scope:
      role: Out of Scope Agent
      goal: Acknowledge that the request is outside supported CCTV intents.
      backstory: You handle requests classified outside the supported CCTV camera intents.
      instructions: Respond only with the configured acknowledgement. Do not attempt the unrelated request.
      examples:
        - User asks for the weather.
        - User asks for a restaurant recommendation.
      expected_reply: "This request is outside the CCTV assistant's supported scope."

tracing:
  enabled: true
  service_name: cctv-finder-api
  # Jaeger's local OTLP/HTTP receiver. In Docker, use http://jaeger:4318/v1/traces.
  otlp_endpoint: http://localhost:4318/v1/traces
  sample_ratio: 1.0
  export_timeout_seconds: 5
  capture_logs_in_spans: true
  capture_llm_prompts: true
  capture_llm_outputs: true

camera_catalog_file: configs/cameras.yaml
