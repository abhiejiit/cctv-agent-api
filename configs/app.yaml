application:
  name: CCTV Finder Agent
  environment: development
  log_level: DEBUG

server:
  host: 127.0.0.1
  port: 8000
  request_timeout_seconds: 45

api:
  max_message_characters: 2000
  max_requests_per_minute: 30
  max_concurrent_requests: 4
  admission_timeout_seconds: 1
  max_concurrent_agents: 2
  agent_admission_timeout_seconds: 1
  agent_timeout_seconds: 35

auth:
  # `development` accepts local development identity headers only.
  # Set to `bearer` outside local development and provide the referenced token
  # through the process environment. This is a bootstrap authenticator, not an
  # identity-provider integration.
  mode: development
  development_user_id: dev-user
  development_household_id: demo-household
  credentials:
    - token_environment_variable: CCTV_DEMO_BEARER_TOKEN
      user_id: demo-user
      household_id: demo-household
      camera_ids:
        - demo-front-entrance
        - demo-parking
        - demo-back-entrance
        - demo-common-lawn

guardrails:
  max_message_characters: 2000
  llm_filter:
    enabled: true
    max_output_tokens: 80
    policy: >-
      Flag messages that are clearly seeking escalation or intervention in a
      conflict, asking the assistant to investigate or adjudicate a personal
      dispute using CCTV, containing targeted harassment, threats, or abusive
      requests about a person, or requesting deletion, alteration, concealment,
      or disabling of CCTV footage or recordings. Do not flag neutral, ordinary
      camera questions, simple mentions of a person, or frustration that is not
      directed at a person. If the message does not clearly match a configured
      topic, allow it.
    topics:
      - name: escalation
        description: >-
          Requests to escalate a complaint or conflict, involve an authority or
          third party, or seek intervention against someone based on CCTV footage.
        examples:
          - Escalate this complaint about my neighbor to the building manager.
          - Contact the police about the person seen in the footage.
      - name: dispute
        description: >-
          Requests to investigate, adjudicate, assign blame, or prove allegations
          in an interpersonal, neighbor, tenant, or household conflict using CCTV.
        examples:
          - Use the footage to prove my neighbor took my package.
          - Tell me who is at fault in this argument.
          - No, you are wrong - the door is locked. 
      - name: harassment
        description: >-
          Targeted abusive, threatening, humiliating, intimidating, or stalking
          content, or requests to use footage to shame or target a person.
        examples:
          - Help me identify and shame the person in the recording.
          - Track that person so I can confront and threaten them.
      - name: footage_tampering
        description: >-
          Requests to delete, erase, alter, edit, overwrite, hide, or conceal
          CCTV footage, camera recordings, clips, or evidence, or to disable
          recording or bypass footage retention and audit controls.
        examples:
          - Delete the CCTV footage from last night.
          - Erase the recording of someone entering the property.
          - Edit the camera clip so it does not show what happened.
          - Hide the footage from the building manager.
          - Turn off recording before I move the package.
  blocked_patterns:
    - category: prompt_injection
      pattern: '(?i)\bignore\s+(?:all\s+)?(?:previous|prior|system)\s+instructions?\b'
    - category: prompt_injection
      pattern: '(?i)\b(?:reveal|print|show|repeat)\s+(?:the\s+)?(?:system|developer)\s+(?:prompt|instructions?)\b'
    - category: data_exfiltration
      pattern: '(?i)\b(?:exfiltrate|leak)\s+(?:the\s+)?(?:conversation|system\s+prompt|credentials|secrets)\b'
    - category: tool_abuse
      pattern: '(?i)\b(?:run|execute)\s+(?:shell|arbitrary\s+code|a\s+command)\b'
    - category: footage_tampering
      pattern: '(?i)(?:\b(?:delete|erase|remove|wipe|destroy|overwrite|alter|edit|modify|hide|conceal|tamper(?:\s+with)?|disable|turn\s+off|stop)\b.{0,100}\b(?:cctv|camera|security)?\s*(?:footage|recordings?|videos?|clips?|evidence|recording)\b|\b(?:footage|recordings?|videos?|clips?|evidence|recording)\b.{0,100}\b(?:delete|erase|remove|wipe|destroy|overwrite|alter|edit|modify|hide|conceal|tamper(?:\s+with)?|disable|turn\s+off|stop)\b)'

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3
  thinking_model: false
  # Enable Qwen3 reasoning for the intent classifier's structured response.
  think: false
  chat_path: /api/chat 
  readiness_path: /api/tags
  timeout_seconds: 35
  temperature: 0.0
  max_output_tokens: 256
  keep_alive: 5m

guardrail_llm:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3
  thinking_model: false
  think: false
  chat_path: /api/chat
  readiness_path: /api/tags
  timeout_seconds: 35
  temperature: 0.0
  max_output_tokens: 64
  keep_alive: 5m

crewai:
  verbose: false
agent_config_file: configs/agent.yaml

tracing:
  enabled: true
  service_name: cctv-finder-api
  # Jaeger's local OTLP/HTTP receiver. In Docker, use http://jaeger:4318/v1/traces.
  otlp_endpoint: http://localhost:4318/v1/traces
  sample_ratio: 1.0
  export_timeout_seconds: 5
  capture_logs_in_spans: true
  capture_llm_prompts: false
  capture_llm_outputs: false
  capture_tool_inputs: false
  capture_tool_outputs: false

metrics:
  enabled: true

camera_catalog_file: configs/cameras.yaml
