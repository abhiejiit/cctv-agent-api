application:
  name: CCTV Finder Agent
  environment: development
  log_level: DEBUG

server:
  host: 127.0.0.1
  port: 8000
  request_timeout_seconds: 45

api:
  max_message_characters: 2000
  max_requests_per_minute: 30

auth:
  # `development` accepts local development identity headers only.
  # Set to `bearer` outside local development and provide the referenced token
  # through the process environment. This is a bootstrap authenticator, not an
  # identity-provider integration.
  mode: development
  development_user_id: dev-user
  development_household_id: demo-household
  credentials:
    - token_environment_variable: CCTV_DEMO_BEARER_TOKEN
      user_id: demo-user
      household_id: demo-household

guardrails:
  max_message_characters: 2000
  llm_filter:
    enabled: true
    max_output_tokens: 80
    policy: >-
      Flag messages that are clearly seeking escalation or intervention in a
      conflict, asking the assistant to investigate or adjudicate a personal
      dispute using CCTV, or containing targeted harassment, threats, or abusive
      requests about a person. Do not flag neutral, ordinary camera questions,
      simple mentions of a person, or frustration that is not directed at a
      person. If the message does not clearly match a configured topic, allow it.
    topics:
      - name: escalation
        description: >-
          Requests to escalate a complaint or conflict, involve an authority or
          third party, or seek intervention against someone based on CCTV footage.
        examples:
          - Escalate this complaint about my neighbor to the building manager.
          - Contact the police about the person seen in the footage.
      - name: dispute
        description: >-
          Requests to investigate, adjudicate, assign blame, or prove allegations
          in an interpersonal, neighbor, tenant, or household conflict using CCTV.
        examples:
          - Use the footage to prove my neighbor took my package.
          - Tell me who is at fault in this argument.
          - No, you are wrong - the door is locked. 
      - name: harassment
        description: >-
          Targeted abusive, threatening, humiliating, intimidating, or stalking
          content, or requests to use footage to shame or target a person.
        examples:
          - Help me identify and shame the person in the recording.
          - Track that person so I can confront and threaten them.
  blocked_patterns:
    - category: prompt_injection
      pattern: '(?i)\bignore\s+(?:all\s+)?(?:previous|prior|system)\s+instructions?\b'
    - category: prompt_injection
      pattern: '(?i)\b(?:reveal|print|show|repeat)\s+(?:the\s+)?(?:system|developer)\s+(?:prompt|instructions?)\b'
    - category: data_exfiltration
      pattern: '(?i)\b(?:exfiltrate|leak)\s+(?:the\s+)?(?:conversation|system\s+prompt|credentials|secrets)\b'
    - category: tool_abuse
      pattern: '(?i)\b(?:run|execute)\s+(?:shell|arbitrary\s+code|a\s+command)\b'

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3
  chat_path: /api/chat
  readiness_path: /api/tags
  timeout_seconds: 35
  temperature: 0.0
  max_output_tokens: 128
  keep_alive: 5m

tracing:
  enabled: true
  service_name: cctv-finder-api
  # Jaeger's local OTLP/HTTP receiver. In Docker, use http://jaeger:4318/v1/traces.
  otlp_endpoint: http://localhost:4318/v1/traces
  sample_ratio: 1.0
  export_timeout_seconds: 5
  capture_logs_in_spans: true
  capture_llm_prompts: true
  capture_llm_outputs: true

camera_catalog_file: configs/cameras.yaml
